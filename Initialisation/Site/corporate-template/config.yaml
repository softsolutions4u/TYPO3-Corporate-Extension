# Site configuration of the corporate template demo site.
# On first installation it is written to config/sites/ automatically (the
# "base" of an already existing site for the root page is kept).
rootPageId: 1
base: '/'
dependencies:
  - corporate-template/site
websiteTitle: 'Corporate template | Corporate theme'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: EN
    flag: gb
  -
    title: German
    enabled: true
    languageId: 1
    base: /de/
    locale: de_DE.UTF-8
    navigationTitle: DE
    flag: de
    fallbackType: fallback
    fallbacks: '0'
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=7'
routes: {  }
